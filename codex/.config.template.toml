skills.max_context_tokens = 3500
project_doc_max_bytes = 65536
personality = "pragmatic"
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
# Запись в рабочие каталоги. Расширение доступа проверяет агент.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[features]
multi_agent = true

[shell_environment_policy.set]
MAGICK_CONFIGURE_PATH = "$HOME/.config/ImageMagick"

[plugins."github@openai-curated"]
enabled = true

[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

# __DOTFILES_PLUGINS__

# Не запускать неиспользуемый сервер Figma из плагина навыков.
[plugins."ux-ui-agent-skills@dotfiles-local".mcp_servers.figma]
enabled = false

# __MCP_SERVERS__

# Выбор шаблонов включается явно в нужном проекте.
[mcp_servers.openai_artifact_template_picker]
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
args = ["/Applications/ChatGPT.app/Contents/Resources/artifact-template-picker/server.mjs"]
enabled = false

[apps.connector_76869538009648d5b282a4bb21c3d157.tools.github_add_comment_to_issue]
approval_mode = "approve"

[[skills.config]]
name = "build-ios-apps:swiftui-liquid-glass"
enabled = false

[[skills.config]]
name = "build-ios-apps:ios-debugger-agent"
enabled = false

[[skills.config]]
name = "build-ios-apps:ios-app-intents"
enabled = false

[[skills.config]]
name = "build-ios-apps:swiftui-performance-audit"
enabled = false

[[skills.config]]
name = "build-ios-apps:swiftui-ui-patterns"
enabled = false

[[skills.config]]
name = "build-ios-apps:swiftui-view-refactor"
enabled = false

[[skills.config]]
name = "build-web-apps:deploy-to-vercel"
enabled = false

[[skills.config]]
name = "build-web-apps:supabase-postgres-best-practices"
enabled = false

[[skills.config]]
name = "build-web-apps:stripe-best-practices"
enabled = false

[projects."$HOME/Documents/TED-ai-and-programming"]
trust_level = "trusted"

[projects."$HOME/Documents/ai-for-junior"]
trust_level = "trusted"

[projects."$HOME/dotfiles"]
trust_level = "trusted"

[projects."$HOME/Documents/slidev-theme-practicum"]
trust_level = "trusted"

[projects."$HOME/Documents/Playground"]
trust_level = "trusted"

[marketplaces.openai-bundled]
last_updated = "2026-04-17T17:40:16Z"
source_type = "local"
source = "$HOME/.codex/.tmp/bundled-marketplaces/openai-bundled"

# Синтетические повторы команд, доступных через основные навыки.

[[skills.config]]
name = "create-slidev-theme:source-command-create-theme"
enabled = false

[[skills.config]]
name = "presentation-craft:source-command-audience"
enabled = false

[[skills.config]]
name = "presentation-craft:source-command-slide"
enabled = false

[[skills.config]]
name = "presentation-craft:source-command-structure"
enabled = false
