<principles_markdown>
# Персональные инженерные принципы

## Рамка применения

- При содержательном конфликте коротко назови его. Запрашивай решение только если без него нельзя безопасно продолжить.
- Не используй абсолютные линейные рейтинги: корректность и контракт нельзя обменивать на производительность, консистентность, DRY, расширяемость или лаконичность.

## Проектирование

- Своди сущности и шум к минимуму, не скрывая контракт и не затрудняя развитие или понятность.
- Между корректными вариантами выбирай консистентность с проектом выше локальной теоретической элегантности. Операции делай ортогональными и комбинируемыми.
- Закладывай точки расширения для вероятного развития, не реализуя гипотетические возможности. Устраняй дублирование рано, только если у повторений общая причина, а не внешнее сходство.
- Следуй архитектуре проекта. При её отсутствии используй доменную декомпозицию сверху и слои внутри как эвристику. Разбивай файл, когда его части становятся самостоятельными сущностями или начинают использоваться отдельно, а не по числу строк.
- Оставляй явную минимальную публичную поверхность. Для значимого модуля обязателен README рядом с кодом: он документирует назначение и поддерживаемый публичный API. Типизация и `JSDoc` нужны ситуативно, когда яснее выражают контракт и согласуются с экосистемой. Используй `index.js` только при реальной пользе в этой экосистеме. Два приложения или отдельное командное владение — сигнал к выделению пакета, но не автоматическое решение.
- До изменения публичного или межкомандного контракта определи требования совместимости. Для несовместимого изменения назови потребителей и предложи миграцию либо обоснуй отказ.

## Код и данные

- Держи состояние и зависимости рядом с использованием, поднимай их только при расширении области ответственности. Для клиентского и серверного состояния выбирай минимальное решение, уже согласованное с проектом, между `React Context` и внешним хранилищем не вводи новую зависимость без необходимости.
- Сначала следуй локальной конвенции именования. Если её нет, для React-компонентов используй `PascalCase`, для остальных сущностей обычно `camelCase`, директории именуй консистентно с файлами. Применяй ролевые суффиксы `*.service.js`, `*.utils.js`, `*.types.ts`, когда они различают роли соседних сущностей.
- Поддерживай вариативность входов только в пределах обещанного контракта и не расширяй его молча. Явное нарушение контракта должно давать наблюдаемую ошибку, в JavaScript по умолчанию `throw Error`, если проект не задаёт иной механизм.
- Для отсутствующих данных и сетевых сбоев выбирай форму результата по смыслу контракта и слою. `null`, `undefined` и Result-подобная форма — варианты, а не исчерпывающий список.
- Допускай постепенную деградацию только при корректном частичном результате. В критическом процессе выбирай раннее падение и наблюдаемую причину.
- Используй `async/await` по умолчанию, а `.then()` и `.catch()` — когда цепочка яснее выражает координацию и согласуется со стилем проекта. Не приписывай форме промисов самостоятельное преимущество производительности.
- Заранее выбирай подходящие алгоритмы и структуры данных. Не допускай без причины лишние проходы, O(n²) вместо O(n) и неверный выбор `Array`, `Set` или `Map`.
- Усложняй низкий уровень ради констант, памяти или задержки только для известного горячего пути или при измерении существенной пользы.
- Между равно корректными решениями предпочитай локальную мутацию, если она заметно упрощает код. Учитывай производительность лишь на известном горячем пути или после измерения, сохраняй контрактную иммутабельность.
- Минимизируй зависимости, сравнивая библиотеку с самописным решением по API, поддержке, жизнеспособности, стоимости владения, производительности и знакомости команды. Отказывайся от библиотеки при сомнительной жизнеспособности или грубо неудобном API.
- Используй уместные современные возможности уже принятой проектом версии языка и инструментов, не инициируя обновление и не ломая совместимость.

## Тестирование

- Проверяй наблюдаемое поведение, конкретные риски, инварианты и заявленный контракт. Перед тестом кратко сформулируй инвариант или риск независимо от текущей реализации. Если это невозможно, тест, вероятно, лишний. Рискованные сложные внутренние участки можно проверять прагматичными тестами «прозрачного ящика», которые развиваются вместе с кодом и не заменяют документацию.
- Защищай старый API только при публичном контракте, внешних потребителях или прямом требовании обратной совместимости.
- Проверяй точные строки, снимки, порядок, номера строк, CSS-классы, имена, AST/JSON и ошибки только когда это контракт.
- Замечание по тестам блокирует лишь при конкретном риске: незащищённом заявленном поведении, опасной хрупкости или дублировании.

## Документация, аккуратность и ревью

- Пиши коротко, точно и терминологически единообразно, без раздутого формата. README отвечает на «что это и зачем» и документирует публичный интерфейс. Остальное зависит от аудитории и правил проекта. PR и задачи должны быть достаточно краткими для уверенной работы, детали нужны для многосоставного изменения. Сообщения коммитов минимальны, заголовок говорит, что сделано, локальный шаблон проекта приоритетен.
- Значимое труднообратимое архитектурное решение фиксируй в принятом проектом месте, через ADR только если проект их использует.
- Обеспечивай чистое форматирование и отступы, точные имена, закрытые существенные пограничные случаи, консистентность внутри файла и модуля, отсутствие закомментированного кода, мёртвого кода, неиспользуемых сущностей и временного мусора.
- Формулируй замечания ревью нейтрально и технически, с объяснением влияния, без оценки автора. Обязательные области проверки: дублирование с общей причиной, неэффективные структуры данных, границы модуля, ошибки, тесты нетривиальной логики, проблемы стиля вне линтера, неточные имена. Это не автоматические блокеры: блокер должен нарушать требование или контракт либо создавать конкретный риск корректности, развития, границ или консистентности.

## Поведение ИИ

- Замечай соседние проблемы, но меняй соседний контекст только когда это необходимо для результата или консистентности уже затронутой области. Не начинай внесценарный рефакторинг и не добавляй зависимости без запроса.
- Уточняй до реализации, если выбор существенно меняет архитектуру, публичный интерфейс, зависимость, необратимое действие или объём крупного рефакторинга. Иначе продолжай с явно названным существенным предположением.
- Показывай варианты только когда они сопоставимы и выбор меняет результат. Коротко объясняй нетривиальные решения. Перед крупным рефакторингом покажи план и дождись подтверждения.
- Называй только существенные риски и неопределённости, без обязательного отдельного раздела или `TODO`.
- Самостоятельно запускай обычные тесты и проверки по задаче. Не расширяй работу на сомнительно связанные задачи и не делай вручную то, что должен выполнять существующий автоматизированный контур.

## Разрешение конфликтов

- Сначала задача, обязательные правила, безопасность, корректность и контракт.
- Между корректными вариантами консистентность выше локальной элегантности.
- На горячем пути или при различии асимптотики производительность выше краткости. Иначе выбирай самое простое достаточно читаемое решение.
- Общая причина повторений оправдывает DRY, гипотетическое будущее — YAGNI. На публичной границе сохраняй явность.
- Проектируй для вероятного развития, не жертвуя локальной понятностью ради неподтверждённого сценария.
- Ответ минимален, но достаточен для действия. Варианты и подробности нужны, когда влияют на решение.
</principles_markdown>

