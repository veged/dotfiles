<principles_markdown>
# Персональные инженерные принципы

## Основные приоритеты

- Лаконичность важнее вербозности.
- Консистентность важнее локальной «правильности».
- Производительность учитывай на этапе проектирования, а не только постфактум.
- Архитектура должна естественно расширяться без преждевременного раздувания.
- Сложность собирай из небольших ортогональных примитивов.
- Раннее устраняй дублирование, если у повторений одна и та же причина.
- Минимизируй зависимости, но не ценой худшего решения.
- Проактивность ИИ нужна только на прямом пути к задаче.

## Проектирование и архитектура

- Предпочитай лаконичные, ортогональные, комбинируемые интерфейсы.
- Сохраняй консистентность с существующим кодом; при необходимости выправляй соседний контекст.
- Основная декомпозиция: домен сверху, слои внутри.
- Разбивай файл, когда его части становятся самостоятельными сущностями, а не по числу строк.
- Контракты между модулями делай явными; минимальный `export` обязателен.
- `index.js` используй там, где он реально упрощает публичный интерфейс.
- Выноси код в отдельный пакет или воркспейс, когда его используют два и более приложения или им фактически владеет другая команда.
- Закладывай точки расширения архитектурно, но не реализуй заранее объёмный код без текущей потребности.

## Код и данные

- Держи состояние и зависимости максимально близко к месту использования.
- Для React предпочитай `PascalCase` у компонентов; в остальном обычно `camelCase`, если экосистема не диктует иное.
- Суффиксы вроде `*.service.js`, `*.utils.js`, `*.types.ts` используй, когда они помогают различать роли файлов.
- Функции делай полиморфными на доброкачественных входах; при нарушении контракта предпочитай `throw Error`.
- На краях системы предпочитай постепенную деградацию; в критических процессах — раннее падение и хорошую наблюдаемость.
- `async/await` — дефолт. `.then()` / `.catch()` допустимы, когда цепочка лучше выражает координацию и помогает производительности.
- Оцени алгоритмы и структуры данных заранее; лишние проходы, O(n²) без причины и неправильный выбор между `Array`, `Set` и `Map` считай инженерным дефектом.
- Мутации допустимы, когда они упрощают код или улучшают производительность. Иммутабельность обязательна, если она часть публичного контракта.

## Зависимости

- Не добавляй зависимость без явной выгоды по качеству решения.
- Оцени API, поддержку, живость проекта, стоимость владения, влияние на производительность и знакомость команды.
- Избегай полумёртвых библиотек и библиотек с грубо неудобным API.

## Тестирование

- Тестируй поведение и реальные риски регрессии.
- Перед добавлением теста сформулируй, какой инвариант или риск он защищает.
- Не пиши без явного запроса тесты на старую форму API, если она не является публичным контрактом.
- Не закрепляй случайную форму реализации: строки, снапшоты, порядок, CSS-классы, внутренние имена, форму AST/JSON и текст ошибок, если это не контракт.
- Блокеры в тестах: избыточность, хрупкость, недостаточное покрытие заявленной функциональности.

## Документация и ревью

- Пиши коротко, точно, консистентно по терминологии и без раздутых форматов.
- README должен отвечать на «что это и зачем» и документировать публичный API.
- ADR нужен для нетривиальных архитектурных решений.
- PR и тикеты держи лаконичными; детали нужны только там, где изменение реально многосоставное.
- Коммит-сообщения делай минимальными.
- Блокеры в ревью: дублирование, неэффективные структуры данных, нарушение архитектурных границ модуля, отсутствие обработки ошибок, отсутствие тестов на нетривиальную логику, style-проблемы вне линтера, плохое именование.

## Поведение ИИ

- Замечай риски рядом с задачей, но не уходи в побочную работу без ясной связи с целью.
- Не рефакторь вне зоны задачи и не добавляй зависимости без явного запроса.
- Если есть два-три сильных варианта, показывай их с явными компромиссами.
- При архитектурной развилке, неоднозначных требованиях или выборе библиотеки сначала уточняй.
- Если рефакторинг большой, сначала показывай план.
- Риски и предположения оформляй явно.
- Предлагай точечные тесты только если их отсутствие создаёт конкретный риск регрессии.
- Самостоятельно запускай обычные проверки и тесты, когда это часть нормального контура.

## Приоритеты при конфликте

- Производительность > Лаконичность > Читаемость
- Консистентность с контекстом > Правильность решения > Простота реализации
- DRY > YAGNI > Явность
- Расширяемость > Тестируемость > Локальная понятность
- Лаконичность ответа ИИ > Альтернативы с явными компромиссами > Подробные объяснения
</principles_markdown>

