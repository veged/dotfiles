description = "Найти и воспроизводимо удалить AI-компонент из dotfiles"
prompt = '''<dotfiles_uninstall>
<goal>
Пойми, что пользователь хочет удалить, однозначно сопоставь это с управляемым
компонентом dotfiles, убери его каноническую декларацию и синхронизируй runtime-слои.
</goal>

<input>{{args}}</input>

<input_contract>
Вход может быть естественным описанием возможности, названием, слагом, ссылкой,
путём или явным типом компонента. Если вход пуст, попроси одной фразой описать,
что нужно удалить, и остановись.
</input_contract>

<principles>
- Каноническое удаление начинается в ai/, затем штатный installer приводит runtime
  к декларации. Не удаляй только ~/.codex или другой projection, оставляя источник активным.
- Не угадывай при нескольких совпадениях. Покажи кандидатов и запроси выбор.
- Удаляй только выбранный компонент и необходимые записи его управления.
- Не удаляй credentials, пользовательские данные, внешние аккаунты, системные пакеты,
  кэши или скачанные binaries без отдельного явного запроса.
- Не трогай несвязанные изменения. Не делай commit или push без запроса.
</principles>

<procedure>
1. Найди корень dotfiles и прочитай AGENTS.md, ai/README.md, README реестров,
   ai/skills/skills.json, ai/plugins/plugins.json, ai/mcp.json и релевантные install-скрипты.
   Проверь рабочее дерево до изменений.
2. Разреши вход против управляемого инвентаря:
   - URL/путь нормализуй и сопоставь с source в реестрах; если вход не содержит
     ревизию, при сравнении отдели суффикс #<sha>[:subdirectory] канонической записи;
   - название/слаг сопоставь с ключами, package names и manifests;
   - естественное описание сопоставь с description во frontmatter SKILL.md,
     plugin manifests, MCP entries, commands и instructions;
   - учитывай как канонические декларации, так и их runtime-проекции.
3. Если совпадений нет, сообщи, что компонент не управляется dotfiles, и не удаляй
   похожие объекты. Если совпадений несколько, запроси точный выбор.
4. До мутации определи область удаления:
   - весь внешний skill source → удалить его запись из ai/skills/skills.json;
   - один skill из "*" → добавить !name; из явного списка → удалить имя;
     пустую после этого запись удалить целиком;
   - plugin → удалить его единственную запись из ai/plugins/plugins.json вместе
     со всеми skills, commands, agents и общими ресурсами этого пакета;
   - MCP → удалить его ключ из ai/mcp.json;
   - локальный tracked package, instruction или command → удалить точные исходные файлы.
   Если локальный пакет, общий source или смешанная запись затрагивает дополнительные
   компоненты, покажи impact и запроси подтверждение.
5. Сначала измени source of truth. Сохрани стиль, валидность и минимальный diff.
6. Синхронизируй затронутые runtime-слои:
   - skills: ./scripts/install-skills --update;
   - plugins: ./scripts/install-plugins --update; штатно удали установленный plugin
     из Codex и Claude Code и проверь удаление локальной Cursor-проекции;
   - MCP: ./scripts/install-mcp --sync-only;
   - иной слой: его документированный reconcile/check.
   Не удаляй оставшиеся binaries или secrets автоматически; перечисли их как retained artifacts.
7. Проверь, что выбранная декларация и её управляемые projections исчезли, соседние
   компоненты сохранились, JSON/TOML валидны, git diff --check и релевантные тесты проходят.
8. В финале назови удалённый компонент, изменённый canonical layer, очищенные projections,
   намеренно сохранённые данные/binaries и несвязанные изменения рабочего дерева.
</procedure>
</dotfiles_uninstall>'''
